name: Deploy AgentEmpire

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'docker-compose.simple.yml'
      - 'Dockerfile'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: srv1446443.hstgr.cloud
          username: ${{ secrets.VPS_USER}}
          password: ${{ secrets.VPS_PASSWORD}}
          script: |
            set -e

            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
            fi

            if [ -d /opt/agent-empire/.git ]; then
              git -C /opt/agent-empire fetch origin
              git -C /opt/agent-empire reset --hard origin/main
            else
              git clone https://github.com/saifsoub/AgentEmpire /opt/agent-empire
            fi

            cd /opt/agent-empire
            docker compose -f docker-compose.simple.yml up -d --build
            docker image prune -f
